# Reverse proxy for api.shoebox.app (replace with your real domain before
# first deploy). Strategy:
#   - Port 80: only ACME challenge endpoint serves traffic; everything else
#              redirects to HTTPS. Cert auto-renewal needs port 80 open.
#   - Port 443: terminates TLS, proxies all /v1/* to the backend container.
#
# After replacing `api.shoebox.app` below, run the initial cert request
# (one-shot) as documented in `docs/vps-deploy.md`, then start the stack.

server {
    listen 80;
    server_name api.shoebox.app;

    # Let's Encrypt webroot challenge — keep this above the catch-all.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.shoebox.app;

    # Generated by certbot during the first cert issue.
    ssl_certificate     /etc/letsencrypt/live/api.shoebox.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shoebox.app/privkey.pem;

    # Modern profile (TLS 1.2 + 1.3). Drop TLSv1.0/1.1.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers — small but free wins for App Store review.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Generous body size for the rare debug endpoints; lower if you don't
    # have any upload paths.
    client_max_body_size 2m;

    # Health probe straight to the API container — used by uptime monitors.
    location = /health {
        proxy_pass http://api:8000/;
        access_log off;
    }

    location / {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The API is async-IO; long-poll endpoints can take 60s+ for the
        # api-sports refresh path. Give them headroom without unbounded
        # idle connections.
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
    }
}
