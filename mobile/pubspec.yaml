name: shoebox_mobile
description: "Shoebox — Pre-match stats for serious bettors."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Networking
  dio: ^5.7.0

  # Routing
  go_router: ^14.6.2

  # Charts
  fl_chart: ^0.69.2

  # UI helpers
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Date formatting
  intl: ^0.20.2

  # Auth
  supabase_flutter: ^2.8.0

  # In-app subscriptions
  purchases_flutter: ^8.3.0

  # Local persistence (watchlist cache, settings)
  shared_preferences: ^2.3.3

  # AdMob — rewarded ads for the hybrid paywall (Model B)
  google_mobile_ads: ^5.3.0

  # Local notifications — kickoff reminders for watchlisted fixtures
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Used to deep-link into the OS notification settings screen
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  # iOS dark mode + tinted variants (iOS 18 supports these; ignored on older)
  image_path_ios_dark_transparent: "assets/icon/app_icon.png"

# Generated splash background + centred logo. Re-run with:
#   dart run flutter_native_splash:create
# `color` matches ShoeboxColors.navy so the splash blends straight into the
# Material navy scaffold once the Flutter engine paints its first frame.
flutter_native_splash:
  color: "#0B1220"
  image: "assets/icon/splash_logo.png"
  # iOS: render the logo at ~30% of the screen width on every device
  # (LaunchImage is centred at its native size, so we pick a value that
  # reads well on the smallest supported screen).
  ios_content_mode: center
  android_12:
    color: "#0B1220"
    image: "assets/icon/splash_logo.png"
  ios: true
  android: true
  web: false
